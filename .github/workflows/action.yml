# Runs the ward GitHub Action (action.yml at the repository root) the way an
# outside repository would, against .github/action-demo: install the
# latest release, sync under the company policy, audit, SBOM. One leg
# keeps the store in the cache, one runs the signed gate.
#
# The company policy denies `unrecorded-resolution`, so the demo commits a
# signed resolution record per lock (.github/action-demo/.greyward/resolution/).
# They were signed once, by a key made for that and then thrown away; its
# public key is DEMO_RECORD_KEY below. Changing the demo's requirements.in,
# requirements.txt, package.json or package-lock.json voids them. To sign
# new ones: `ward keygen <path>`, put its public key in DEMO_RECORD_KEY and
# the [signing] list of a copy of the company policy, then, in the demo with
# GREYWARD_POLICY and GREYWARD_SIGNING_KEY set, `ward attest python` and
# `ward attest node`.
#
# Only when the action or something it reads changes, or by hand
# (`gh workflow run action`): it tests the released binary, not the code in
# the checkout, so every other pull request would learn nothing from it.
name: action

on:
  workflow_dispatch:
  pull_request:
    paths:
      - action.yml
      - .github/workflows/action.yml
      - install.sh
      - docs/human/policy-company.toml
      - .github/action-demo/**

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('action-pr-{0}', github.event.pull_request.number) || format('action-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  demo:
    # 22.04 lets bwrap have a user namespace as it comes; 24.04 does not,
    # so that leg is the one that needs the action's AppArmor profile. The
    # 22.04 leg also runs with the store cache on: its first run saves it,
    # the next one restores it. The leg only shows the cache steps do not
    # break a run: nothing here asserts the restore. Every leg signs its
    # closures with a throwaway key: a policy with a [signing] table, which
    # the records need, has `ward audit` check closure signatures too. The
    # signed leg also runs `audit: signed` and checks every signature.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            cache: "true"
          - os: ubuntu-24.04
          - os: ubuntu-24.04
            signed: true
    name: demo (${{ matrix.os }}${{ matrix.signed && ', signed' || '' }})
    runs-on: ${{ matrix.os }}
    env:
      DEMO_RECORD_KEY: ed25519:55bddc75bcf43d8ed84d8d4b035f0000d7a5ea33b46a96713875eca98e14e141
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # A key made here, not with `ward keygen`: ward is not installed until
      # the action runs. The key file is `ed25519:<seed hex>`, the policy
      # names `ed25519:<public key hex>`, and openssl's DER forms end in
      # those 32 bytes.
      - name: A throwaway signing key, and a policy that trusts it and the records' key
        id: key
        run: |
          set -euo pipefail
          der="$RUNNER_TEMP/key.der"
          openssl genpkey -algorithm ed25519 -outform DER -out "$der"
          seed=$(tail -c 32 "$der" | od -An -v -tx1 | tr -d ' \n')
          public=$(openssl pkey -inform DER -in "$der" -pubout -outform DER | tail -c 32 | od -An -v -tx1 | tr -d ' \n')
          rm -f "$der"
          # Not masked: GitHub drops a step output that holds a masked
          # value, and this key is made for this job and thrown away.
          policy="$RUNNER_TEMP/greyward-policy.toml"
          cp docs/human/policy-company.toml "$policy"
          printf '\n[signing]\ntrusted = ["%s", "ed25519:%s"]\n' "$DEMO_RECORD_KEY" "$public" >> "$policy"
          echo "key=ed25519:$seed" >> "$GITHUB_OUTPUT"
          echo "policy=$policy" >> "$GITHUB_OUTPUT"
      - uses: ./
        id: ward
        with:
          working-directory: .github/action-demo
          sbom-artifact: sbom-${{ matrix.os }}${{ matrix.signed && '-signed' || '' }}
          cache: ${{ matrix.cache || 'false' }}
          policy: ${{ steps.key.outputs.policy }}
          audit: ${{ matrix.signed && 'signed' || 'true' }}
          signing-key: ${{ steps.key.outputs.key }}
      - name: The environment runs, under the policy the action set
        working-directory: .github/action-demo
        env:
          GREYWARD_VERSION_LINE: ${{ steps.ward.outputs.version }}
          GREYWARD_SBOM: ${{ steps.ward.outputs.sbom }}
          GREYWARD_EXPECTED_POLICY: ${{ steps.key.outputs.policy }}
        run: |
          set -euo pipefail
          echo "$GREYWARD_VERSION_LINE"
          case "$GREYWARD_VERSION_LINE" in "ward "*) ;; *) exit 1 ;; esac
          test "$GREYWARD_POLICY" = "$(realpath "$GREYWARD_EXPECTED_POLICY")"
          ward run python -c 'import six; print("six", six.__version__)'
          jq -e '.bomFormat == "CycloneDX"' "$GREYWARD_SBOM"
          ward status
      - name: Every closure is signed by the trusted key
        if: matrix.signed
        working-directory: .github/action-demo
        run: |
          set -euo pipefail
          ward audit --signed --json | jq -e '.passed and (.closures | length > 0) and all(.closures[]; .signature.state == "trusted")'
          test ! -e "$RUNNER_TEMP/greyward-signing.key"
