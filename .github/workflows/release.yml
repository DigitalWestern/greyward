# Build the released platforms on a version tag, attest their build
# provenance, and attach them to a draft GitHub Release. install.sh and
# `ward update --self` download exactly these asset names, so keep them
# stable: greyward-<triple>.tar.gz, greyward-<triple>.tar.gz.sha256, and the
# greyward-<triple>.tar.gz.sig that tools/release-sign.sh adds.
#
#   git tag v0.1.0 && git push origin v0.1.0
#   # then, where the release key lives, once this workflow is done:
#   GREYWARD_RELEASE_KEY=<key file> tools/release-sign.sh v0.1.0
#
# The tag must match Cargo.toml's version; the build fails otherwise.
#
# Nothing installs a draft, and nothing here can sign: the release key never
# reaches CI, so a token that can write releases cannot ship a binary ward
# or install.sh accepts (#698). The publish job refuses a tag whose release
# is already published rather than replace its assets.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Read-only by default: the build job runs every dependency's build script,
# so it must not hold a token that can write releases. Only the publish job
# below gets write access.
permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.triple }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest glibc we build against sets the floor for every Linux user
          # (22.04 = glibc 2.35). src/kernel/platform.rs owns the platform list.
          - os: ubuntu-22.04
            triple: x86_64-unknown-linux-gnu
          # macOS arm64 returns with the macOS gate (FOLLOW-UPS.md). Its suite fails on
          # the hosted macos-14 runner today (sandbox, fsroot and node tests,
          # run of 2026-09-25), and publish needs every leg green. Restore:
          #   - os: macos-14
          #     triple: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check the tag against Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          crate="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "$tag" != "$crate" ]; then
            echo "tag v$tag does not match Cargo.toml version $crate" >&2
            exit 1
          fi

      # rust-toolchain.toml names the compiler; with no argument rustup
      # installs exactly that one, the same compiler ci.yml tested.
      - name: Install Rust
        run: |
          rustup toolchain install --no-self-update
          rustup target add ${{ matrix.triple }}

      # A tag push does not wait for ci.yml on the tagged commit, so the
      # offline suite runs here, on each platform, before anything ships.
      # The Linux sandbox tests need bubblewrap, which the runner lacks;
      # macOS uses the system's own sandbox.
      - name: Install the Linux sandbox
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.triple }}

      # Apple Silicon refuses unsigned arm64 binaries, and `strip = true` in
      # Cargo.toml can invalidate the linker's ad-hoc signature. Re-sign.
      - name: Ad-hoc sign (macOS)
        if: runner.os == 'macOS'
        run: codesign --force --sign - "target/${{ matrix.triple }}/release/ward"

      - name: Smoke test
        shell: bash
        run: |
          set -euo pipefail
          bin="target/${{ matrix.triple }}/release/ward"
          "$bin" --version
          "$bin" completions bash >/dev/null
          "$bin" completions zsh >/dev/null
          "$bin" completions fish >/dev/null

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          asset="greyward-${{ matrix.triple }}.tar.gz"
          mkdir -p dist/stage
          cp "target/${{ matrix.triple }}/release/ward" dist/stage/ward
          # No host metadata: macOS's bsdtar otherwise adds `._ward` and
          # binary xattr records, and ward's own reader, which `ward self
          # update` unpacks with, refuses an archive whose headers and
          # tar's listing disagree.
          COPYFILE_DISABLE=1 tar --no-xattrs -C dist/stage -czf "dist/$asset" ward
          cd dist
          if command -v sha256sum >/dev/null; then
            sha256sum "$asset" > "$asset.sha256"
          else
            shasum -a 256 "$asset" > "$asset.sha256"
          fi
          cat "$asset.sha256"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: greyward-${{ matrix.triple }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  # Build provenance for each archive, so anyone can check with
  # `gh attestation verify <asset> --repo DigitalWestern/greyward` that it
  # was built here, by this workflow. Its own job: the OIDC token the
  # attestation needs never sits next to the build's dependency scripts.
  attest:
    name: attest build provenance
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz

  release:
    name: publish draft release
    needs: [build, attest]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true

      # A draft only. A re-run may replace a draft's assets (it is not
      # signed yet, or its .sig files stop matching and every client
      # refuses it), never a published release's.
      - name: Create or update the draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          ls -l dist
          tag="$GITHUB_REF_NAME"
          if draft="$(gh release view "$tag" --json isDraft -q .isDraft 2>/dev/null)"; then
            if [ "$draft" != true ]; then
              echo "::error::release $tag is already published; refusing to replace its assets. Tag a new version instead."
              exit 1
            fi
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* \
              --draft \
              --title "ward $tag" \
              --generate-notes
          fi
          echo "draft release $tag is ready; sign and publish it with tools/release-sign.sh $tag"
